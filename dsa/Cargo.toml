[package]
name = "dsa"
version = "0.1.0"
edition = "2021"

# Rust rewrite of the Python DSA practice questions
# (from C:\Users\deepa\Projects\AI_Python\DSA-)
#
# Organized by topic folders under src/bin/, mirroring the Python layout:
#   arrays/ strings/ linked_list/ trees/ graphs/
#
# Because files live in subfolders, each question needs an explicit [[bin]]
# entry (cargo only auto-discovers files directly inside src/bin/).
#
# Run any question with:   cargo run --bin <name>
#   e.g. cargo run --bin arrays_01_two_sum
# Run everything:          cargo run --bin arrays_01_two_sum ... (or use the loop below)

