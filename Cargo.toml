[package]
name = "Rust"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = { version = "1.8.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"

# Q27, Q35 — error types without the boilerplate
thiserror = "2.0"

# Q33, Q35 — structured logging with spans
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Q34, Q35 — SQLite. First build after adding this is slow; that is expected.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
[[bin]]
name = "borrow"
path = "src/borrow.rs"
[[bin]]
name = "rectangle"
path = "src/rectangle.rs"
[[bin]]
name = "enum"
path = "src/enum.rs"
[[bin]]
name = "enum2"
path = "src/enum2.rs"
[[bin]]
name = "shapes"
path = "src/shapes.rs"
[[bin]]
name = "macro"
path = "src/macro.rs"
[[bin]]
name = "debug_display"
path = "src/debug_display.rs"
[[bin]]
name = "serde_demo"
path = "src/serde.rs"
[[bin]]
name = "borsh"
path = "src/borsh.rs"
[[bin]]
name = "lifetime"
path = "src/lifetime.rs"
[[bin]]
name = "tcp"
